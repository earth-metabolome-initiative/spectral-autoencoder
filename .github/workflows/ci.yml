name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check minimal features
        run: cargo check --no-default-features

      - name: Check std features
        run: cargo check --no-default-features --features std

      - name: Check training targets
        run: cargo check --all-targets --no-default-features --features std,train

      - name: Check examples
        run: cargo check --examples --no-default-features --features std,train,tui

      - name: Clippy minimal features
        run: cargo clippy --no-default-features -- -D warnings

      - name: Clippy training targets
        run: cargo clippy --all-targets --no-default-features --features std,train -- -D warnings

      - name: Clippy examples
        run: cargo clippy --examples --no-default-features --features std,train,tui -- -D warnings

      - name: Test library
        run: cargo test --lib --no-default-features --features std,train

      - name: Test MGF vectorization
        run: cargo test --test mgf_vectorization --no-default-features --features std,train

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2
        with:
          tool: cargo-tarpaulin

      - name: Coverage
        run: >
          cargo tarpaulin
          --engine llvm
          --out Xml
          --output-dir target/tarpaulin
          --no-default-features
          --features std,train
          --lib
          --test mgf_vectorization

      - name: Upload coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: target/tarpaulin/cobertura.xml
          flags: rust
          name: rust-tarpaulin
          use_oidc: true
          fail_ci_if_error: true

  python:
    name: Python scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Ruff format
        run: uv run --no-project --with ruff ruff format --config pyproject.toml --check scripts

      - name: Ruff lint
        run: uv run --no-project --with ruff ruff check --config pyproject.toml scripts

      - name: Compile scripts
        run: >
          uv run --no-project python -m py_compile
          scripts/annotated_ms2_coordinate_correlations.py
          scripts/annotated_ms2_metric_heatmaps.py
          scripts/annotated_ms2_png_plots.py
          scripts/annotated_ms2_tmap_correlations.py
