name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check minimal features
        run: cargo check --no-default-features

      - name: Check std features
        run: cargo check --no-default-features --features std

      - name: Check training targets
        run: cargo check --all-targets --no-default-features --features std,train

      - name: Check examples
        run: cargo check --examples --no-default-features --features std,train,tui

      - name: Clippy minimal features
        run: cargo clippy --no-default-features -- -D warnings

      - name: Clippy training targets
        run: cargo clippy --all-targets --no-default-features --features std,train -- -D warnings

      - name: Clippy examples
        run: cargo clippy --examples --no-default-features --features std,train,tui -- -D warnings

      - name: Test library
        run: cargo test --lib --no-default-features --features std,train

      - name: Test MGF vectorization
        run: cargo test --test mgf_vectorization --no-default-features --features std,train

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-tarpaulin

      - name: Coverage
        run: >
          cargo tarpaulin
          --engine llvm
          --out Xml
          --output-dir target/tarpaulin
          --no-default-features
          --features std,train
          --lib
          --test mgf_vectorization

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/tarpaulin/cobertura.xml
          flags: rust
          name: rust-tarpaulin
          use_oidc: true
          fail_ci_if_error: true

  python:
    name: Python scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Ruff format
        run: uv run --no-project --with ruff ruff format --config pyproject.toml --check scripts

      - name: Ruff lint
        run: uv run --no-project --with ruff ruff check --config pyproject.toml scripts

      - name: Compile scripts
        run: >
          uv run --no-project python -m py_compile
          scripts/annotated_ms2_coordinate_correlations.py
          scripts/annotated_ms2_metric_heatmaps.py
          scripts/annotated_ms2_png_plots.py
          scripts/annotated_ms2_tmap_correlations.py
